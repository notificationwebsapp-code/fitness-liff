:root{--bg:#f5f7fa;--card:#fff;--ink:#1b2430;--mut:#5b6675;--line:#d9e0e8;--pri:#1d4ed8;--pri-d:#1e40af;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Better Together","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
header .who{font-size:12px;color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
nav button{flex:0 0 auto}
main{padding:14px;max-width:1100px;margin:0 auto}
button,.btn{min-height:44px;padding:0 16px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:var(--r);font:inherit;cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:var(--pri-d)}
button.bad{color:var(--bad);border-color:#e7b4b4}
button.sel{background:#e8efff;border-color:var(--pri);color:var(--pri-d);font-weight:600}
button.sm{min-height:44px;padding:0 12px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:80px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.help{background:#eef4ff;border:1px solid #c9d9f8;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:14px}
.help b{display:block;margin-bottom:4px}
.help ul{margin:4px 0 0;padding-left:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1;min-width:140px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)!important}}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rpt{background:#fff;color:#000;font-size:13px;line-height:1.45}.rpt h1{font-size:18px;margin:0 0 2px}.rpt h2{font-size:15px;margin:14px 0 4px}.rpt table{width:100%;border-collapse:collapse;margin:4px 0}.rpt th,.rpt td{border:1px solid #999;padding:4px 6px;text-align:left}.rpt th{background:#eee}.rpt td.r,.rpt th.r{text-align:right}.rpt .sub td{font-weight:700;background:#f6f6f6}.rpt .grand{font-size:15px;font-weight:700;margin-top:10px}.rpt .sig{display:flex;gap:40px;margin-top:28px}.rpt .sig div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}.rpt .ins{page-break-inside:avoid;margin-bottom:10px}
#printRoot{display:none}
@media print{body>*:not(#printRoot){display:none!important}#printRoot{display:block!important}@page{size:A4;margin:14mm}.rpt .ins{page-break-after:always}.rpt .ins:last-child{page-break-after:auto}}

function modal(html, cls) {

function closeModal(el) { var m = el.closest ? el.closest('.modal-bg') : el; if (m && m.parentNode) m.parentNode.removeChild(m); }

function pickFile(inp) {
  var f = inp.files[0]; if (!f) return; var tbl = $('it').value;
  var rd = new FileReader();
  rd.onerror = function () { showError({message: T('อ่านไฟล์ไม่ได้')}); };
  rd.onload = function () {
    try {
      var sets = [];
      if (/\.csv$/i.test(f.name)) sets.push({table: tbl, rows: parseCSV(String(rd.result))});
      else {
        if (!window.XLSX) throw new Error('XLSX');
        var wb = XLSX.read(rd.result, {type: 'array', cellDates: false, raw: false});
        var names = wb.SheetNames.filter(function (n) { return APP.schema[n] && !APP.schema[n].readonly; });
        if (names.length) names.sort(function (a, b) { return IMPORT_ORDER.indexOf(a) - IMPORT_ORDER.indexOf(b); });
        else names = [wb.SheetNames[0]];
        names.forEach(function (n) { sets.push({table: APP.schema[n] ? n : tbl, rows: sheetRows(wb.Sheets[n])}); });
      }
      if (!sets.length) { showError({message: T('ไม่พบชีตที่รู้จัก')}); return; }
      previewSets(sets, f.name);
    } catch (e) { showError({message: T('อ่านไฟล์ไม่ได้') + ' ' + (e && e.message || '')}); }
  };

function parseCSV(s) {
  var rows = [], row = [], cur = '', q = false; s = s.replace(/^﻿/, '');
  for (var i = 0; i < s.length; i++) {
    var ch = s[i];
    if (q) { if (ch === '"') { if (s[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; } else if (ch !== '\r') cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return aoaToRows(rows);
}

      api('api_emailQueue', d.querySelector('#omt').value, d.querySelector('#omc').value).then(function (r) { APP.settings.cal_mail_to = r.to; APP.settings.cal_mail_cc = r.cc; APP.calN = 0; closeModal(d); render(); var o = modal('<h3>' + h(T('สำเร็จ')) + '</h3><p>' + h(Lg('ส่ง 1 อีเมลไปที่ ' + r.to + (r.cc ? ' (CC ' + r.cc + ')' : '') + ' แล้ว (ใหม่/แก้ ' + r.added + ' · ยกเลิก ' + r.cancelled + ' รอบ)', 'Sent 1 email to ' + r.to + (r.cc ? ' (CC ' + r.cc + ')' : '') + ' (new/changed ' + r.added + ' · cancelled ' + r.cancelled + ')')) + '</p><div class="acts"><button class="pri" data-o>' + h(T('ปิด')) + '</button></div>'); o.querySelector('[data-o]').onclick = function () { closeModal(o); }; })
        .catch(function (e) { if (String((e && e.message) || e).indexOf('req:to') >= 0) showError({message: Lg('กรุณาใส่อีเมลผู้รับอย่างน้อย 1 อีเมล (รูปแบบ name@company.com)', 'Enter at least one valid recipient email (name@company.com).')}); else showError(e); });
    };
  }).catch(showError);
}
function resendCal() {
  var t0 = APP.today, t1 = new Date(t0 + 'T00:00:00Z'); t1.setUTCDate(t1.getUTCDate() + 14); t1 = t1.toISOString().slice(0, 10);
  var d = modal('<h3>' + h(Lg('ส่งตารางซ้ำ / ส่งให้คนอื่น', 'Resend schedule / send to others')) + '</h3><p class="hint">' + h(Lg('เลือกช่วงวันที่ ระบบจะนำคลาสในช่วงนั้นเข้ารายการรอส่ง แล้วคุณใส่อีเมลผู้รับเอง (จะส่งให้ตัวเอง หรือให้สมาชิกก็ได้) ยังเป็นอีเมลฉบับเดียว', 'Pick a date range. Classes in it are added to the waiting list, then you enter the recipients (yourself or members). Still one email.')) + '</p><label>' + h(Lg('ตั้งแต่วันที่', 'From')) + '</label><input id="rf" type="date" value="' + t0 + '"><label>' + h(Lg('ถึงวันที่', 'To')) + '</label><input id="rt" type="date" value="' + t1 + '"><div class="acts"><button data-c>' + h(T('ปิด')) + '</button><button class="pri big" data-o>' + h(Lg('เพิ่มเข้ารายการรอส่ง', 'Add to waiting list')) + '</button></div>');
  d.querySelector('[data-c]').onclick = function () { closeModal(d); };
  d.querySelector('[data-o]').onclick = function () {
    api('api_calResend', d.querySelector('#rf').value, d.querySelector('#rt').value).then(function () { closeModal(d); mailQueue(); }).catch(function (e) {
      var m = String((e && e.message) || e);
      showError({message: m.indexOf('NOTFOUND') >= 0 ? Lg('ไม่มีคลาสในช่วงวันที่นี้', 'No classes in this date range.') : (m.indexOf('too_many') >= 0 ? Lg('คลาสเกิน 200 รอบ ลดช่วงวันที่ลง', 'More than 200 classes. Shorten the range.') : Lg('ช่วงวันที่ไม่ถูกต้อง', 'Invalid date range.'))});
    });
  };
}
function calBar() { return APP.calN ? '<div class="banner todo" style="font-size:15px;flex-wrap:wrap"><span style="flex:1 1 200px">' + h(Lg('มีตารางรอส่งเข้า Outlook ' + APP.calN + ' รอบ (ยังไม่ได้ส่ง)', APP.calN + ' class(es) waiting to be emailed to Outlook (not sent yet)')) + '</span><button class="pri" onclick="mailQueue()">' + h(Lg('ดูและส่งรวม 1 อีเมล', 'Review and send 1 email')) + '</button></div>' : ''; }
function sendBrief() { run(api('api_sendTestBrief'), function (e) { var d = modal('<h3>' + h(T('สำเร็จ')) + '</h3><p>' + h(T('ส่งไปที่')) + ' ' + h(e) + '</p><div class="acts"><button class="pri" data-o>' + h(T('เข้าใจแล้ว')) + '</button></div>'); d.querySelector('[data-o]').onclick = function () { closeModal(d); }; }); }

/* ===== Audit ===== */
function vAudit() {
  run(api('api_list', 'AuditLog'), function (rows) {
    var shown = rows.slice(0, 200);
    $('main').innerHTML = backBar('ประวัติแก้ไข') + helpBox('audit') +
      '<div class="bar"><button onclick="APP.tbl=\'AuditLog\';exportTable(\'AuditLog\',\'xlsx\')">' + h(T('ส่งออก Excel')) + '</button></div>' +
      cardsTable([T('เวลา'), T('ผู้ใช้'), T('ตาราง'), 'ID', T('การกระทำ')], shown.map(function (x) { return [h(x.ts), h(x.user), h(tblLabel(x.table_name)), h(x.row_id), h(x.action)]; })) + (rows.length > 200 ? '<p class="hint">200 / ' + rows.length + '</p>' : '');
  });
}


/* ===== bell ===== */
var BELL = {n: -1, items: [], t: null};
function bellPoll() {
  if (!APP.me || document.hidden) return;
  google.script.run.withSuccessHandler(function (r) {
    var n = r.count, b = $('bellN'); b.textContent = n > 99 ? '99+' : n; b.classList.toggle('on', n > 0);
    if (BELL.n >= 0 && n > BELL.n) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = Lg('มีรายการใหม่รอดำเนินการ', 'New items need your attention'); document.body.appendChild(t); setTimeout(function () { t.remove(); }, 4000); if (APP.tab === 'home' && !document.querySelector('.modal-bg')) render(); }
    BELL.n = n; BELL.items = r.items; APP.badge = r.req + r.slip;
    var ob = document.querySelector('#nav .badge'); if (ob) ob.remove();
    var nb = document.querySelector('#nav button'); if (nb && APP.badge) nb.insertAdjacentHTML('beforeend', '<i class="badge">' + APP.badge + '</i>');
  }).withFailureHandler(function (e) { if (String((e && e.message) || e).indexOf('E_LOCKED') >= 0) location.reload(); }).api_bell();
}
function bellStart() { $('bellBtn').style.display = 'flex'; bellPoll(); clearInterval(BELL.t); BELL.t = setInterval(bellPoll, 60000); document.addEventListener('visibilitychange', function () { if (!document.hidden) bellPoll(); }); }
function bellOpen() {
  var lab = {req: Lg('คำขอรอยืนยัน', 'Request to confirm'), slip: Lg('สลิปรอตรวจ', 'Slip to check'), exp: Lg('ใกล้หมดเวลาโอน', 'Payment time almost up'), risk: Lg('Class เสี่ยงไม่ถึงขั้นต่ำ', 'Class below minimum')};
  var body = BELL.items.length ? BELL.items.map(function (i) { return '<div class="bi"><div style="flex:1"><span class="tag">' + h(lab[i.type]) + '</span><div>' + h(i.text) + '</div>' + (i.at ? '<div class="hint">' + h(i.at) + '</div>' : '') + '</div></div>'; }).join('') : '<div class="empty">' + h(Lg('ไม่มีรายการรอดำเนินการ', 'Nothing pending')) + '</div>';
  var d = modal('<h3>' + h(Lg('การแจ้งเตือน', 'Notifications')) + '</h3>' + body + '<div class="acts"><button data-c>' + h(T('ปิด')) + '</button><button class="pri" data-o>' + h(Lg('ไปที่งานวันนี้', 'Go to Today')) + '</button></div>');
  d.querySelector('[data-c]').onclick = function () { closeModal(d); };
  d.querySelector('[data-o]').onclick = function () { closeModal(d); setTab('home'); };
}

/* ===== login / boot ===== */
function switchUrl() { return 'https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent(APP.url || location.href); }
function showLogin(w, msg) {
  $('nav').innerHTML = ''; $('nav').style.display = 'none'; document.body.style.paddingBottom = '0';
  $('main').innerHTML = '<div class="login card"><div class="logo">' + ICON.cal + '</div><h2>' + h(T('เข้าสู่ระบบ')) + '</h2><div class="em">' +
    (w.email ? h(T('บัญชีที่ใช้อยู่')) + ': <b>' + h(w.email) + '</b>' : h(T('ไม่พบอีเมลของบัญชี'))) + '</div>' +
    '<p style="text-align:center">' + h(msg || T('ระบบสำหรับทีมงานเท่านั้น บัญชีนี้ยังไม่ได้เป็น Admin')) + '</p>' +
    '<a class="btn big pri" style="display:flex;align-items:center;justify-content:center;text-decoration:none" target="_top" rel="noopener" href="' + h(switchUrl()) + '">' + h(T('สลับบัญชี Google')) + '</a>' +
    '<button class="big" style="width:100%;margin-top:8px" onclick="location.reload()">' + h(T('ลองใหม่')) + '</button>' +
    (w.email ? '<h3 style="margin:18px 0 0;font-size:15px">' + h(T('ขอสิทธิ์ Admin')) + '</h3><label>' + h(T('ชื่อของคุณ')) + '</label><input id="rn" name="name" autocomplete="name" value="' + h((function () { try { return localStorage.getItem('fb_name') || ''; } catch (e) { return ''; } })()) + '"><label>' + h(T('ข้อความถึงผู้ดูแล')) + '</label><textarea id="rm"></textarea><button class="pri big" style="width:100%;margin-top:10px" onclick="sendReq()">' + h(T('ส่งคำขอ')) + '</button>' : '') + '</div>';
}
function sendReq() {
  try { localStorage.setItem('fb_name', $('rn').value); } catch (e) {}
  run(api('api_requestAccess', $('rn').value, $('rm').value), function () { var d = modal('<h3>' + h(T('ส่งคำขอแล้ว')) + '</h3><p>' + h(T('รอผู้ดูแลอนุมัติ แล้วกดลองใหม่')) + '</p><div class="acts"><button class="pri" data-o>' + h(T('เข้าใจแล้ว')) + '</button></div>'); d.querySelector('[data-o]').onclick = function () { closeModal(d); }; });
}
function pinModal(first) {
  var d = modal('<h3>' + h(T('ตั้ง/เปลี่ยนรหัส PIN')) + '</h3><p class="hint">' + h(T('ตัวเลข 4-8 หลัก')) + '</p>' + (first ? '' : '<label>' + h(T('PIN เดิม (ถ้ามี)')) + '</label><input id="op" type="password" inputmode="numeric" autocomplete="off">') + '<input type="email" name="username" autocomplete="username" value="' + h(APP.me.email) + '" readonly style="position:absolute;left:-9999px" tabindex="-1" aria-hidden="true"><label>' + h(T('PIN ใหม่')) + '</label><input id="np" name="new-password" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"><div class="acts"><button data-c>' + h(T('ปิด')) + '</button><button class="pri" data-o>' + h(T('บันทึก')) + '</button></div>');
  d.querySelector('[data-c]').onclick = function () { closeModal(d); };
  d.querySelector('[data-o]').onclick = function () { api('api_setPin', d.querySelector('#np').value, first ? '' : d.querySelector('#op').value).then(function () { closeModal(d); var o = modal('<h3>' + h(T('สำเร็จ')) + '</h3><div class="acts"><button class="pri" data-o>' + h(T('เข้าใจแล้ว')) + '</button></div>'); o.querySelector('[data-o]').onclick = function () { closeModal(o); }; }).catch(showError); };
}
function resetPin(id) { confirmBox(T('รีเซ็ต PIN'), T('ผู้ใช้ต้องขอ OTP และตั้ง PIN ใหม่'), T('รีเซ็ต PIN'), function () { run(api('api_resetPin', id), function () { var o = modal('<h3>' + h(T('สำเร็จ')) + '</h3><div class="acts"><button class="pri" data-o>' + h(T('เข้าใจแล้ว')) + '</button></div>'); o.querySelector('[data-o]').onclick = function () { closeModal(o); }; }); }, true); }
function doLogout() { run(api('api_logout'), function () { location.reload(); }); }
var OTPT = null;
function showLock(w) {
  $('nav').innerHTML = ''; $('nav').style.display = 'none'; document.body.style.paddingBottom = '0';
  var needPin = (w.mode === 'pin' || w.mode === 'pin_otp') && w.hasPin, needOtp = w.mode === 'otp' || w.mode === 'pin_otp' || (w.mode === 'pin' && !w.hasPin);
  $('main').innerHTML = '<div class="login card"><div class="logo">' + ICON.gear + '</div><h2>' + h(T('ยืนยันตัวตน')) + '</h2><div class="em">' + h(w.email) + '</div>' +
    '<form onsubmit="doVerify();return false" autocomplete="on"><input type="email" name="username" autocomplete="username" value="' + h(w.email) + '" readonly style="position:absolute;left:-9999px" tabindex="-1" aria-hidden="true">' + (needPin ? '<label for="lp">PIN</label><input id="lp" name="password" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password">' : '') +
    (needOtp ? '<label for="lo">OTP</label><input id="lo" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="big" style="width:100%;margin-top:8px" id="sendOtp" onclick="sendOtpBtn()">' + h(T('ขอรหัส OTP ทางอีเมล')) + '</button><p class="hint" id="otpHint"></p>' : '') +
    '<button type="submit" class="pri big" style="width:100%;margin-top:10px">' + h(T('เข้าสู่ระบบ')) + '</button></form>' +
    '<p class="hint" style="text-align:center">' + h(T('ไม่ต้องกรอกซ้ำเมื่อรีเฟรช จนกว่าจะหมดเวลา')) + '</p>' +
    '<a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" target="_top" rel="noopener" href="' + h(switchUrl()) + '">' + h(T('สลับบัญชี Google')) + '</a></div>';
  window._lw = w;
}
function sendOtpBtn() {
  var b = $('sendOtp'); b.disabled = true;
  api('api_sendOtp').then(function (m) { var left = 60; $('otpHint').textContent = T('ส่ง OTP ไปที่อีเมลแล้ว'); clearInterval(OTPT); OTPT = setInterval(function () { left--; b.textContent = T('ขอรหัสใหม่ได้ใน') + ' ' + left + ' ' + T('วินาที'); if (left <= 0) { clearInterval(OTPT); b.disabled = false; b.textContent = T('ขอรหัส OTP ทางอีเมล'); } }, 1000); }).catch(function (e) { b.disabled = false; showError(e); });
}
function doVerify() {
  var pin = $('lp') ? $('lp').value : '', otp = $('lo') ? $('lo').value : '';
  api('api_verifyLogin', pin, otp).then(function (r) { startApp(r && r.needPin); }).catch(showError);
}
function startApp(askPin) {
  $('nav').style.display = ''; document.body.style.paddingBottom = '';
  return api('api_init').then(function (r) {
    APP.me = r.me; APP.schema = r.schema; APP.settings = r.settings; APP.today = r.today; APP.url = r.url || APP.url; APP.labels = r.labels; APP.dirty = false; APP.mode = r.settings.login_mode || 'google';
    APP.tab = 'home'; SUB = null;
    calRefresh().then(function () { render(); bellStart(); if (askPin) pinModal(true); });
  });
}
document.documentElement.lang = LANG;
$('main').innerHTML = loadingHtml();
api('api_whoami').then(function (w) {
  APP.url = w.url; APP.mode = w.mode;
  if (!w.isAdmin) { showLogin(w); return; }
  if (!w.verified) { showLock(w); return; }
  return startApp(false);
}).catch(function (e) { showLogin({email: ''}, errMsg(e)); });
</script>
